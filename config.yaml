camera_topic: /tiago/camera/color/image_raw
model: smolvlm2
prompt: describe_scene
vision:
  backend: api
  provider: nebula
  max_output_tokens: 4096
  reasoning_effort: low

modeling:
  reasoning_effort: low  # Optional API control; omitted preserves provider default.
  backend: api
  provider: nebula
  max_output_tokens: 4096
# vision:
#   device: auto
#   dtype: auto
# modeling:
#   model: qwen3-0.6b
planning:
  reasoning_effort: low  # Independent of modeling; requires provider support.
  max_output_tokens: 4096
goal: |
  # Goal

  Explore the environment to discover previously unobserved objects and relationships.
execution:
  max_cycles: 1
  action_timeout: 30.0

# Providers used when vision.backend or modeling.backend is api.
# Keep credentials in the repository .env or process environment, never here.
openai:
  base_url: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY
  models:
    text: gpt-4.1-mini
    vision: gpt-4.1-mini
  timeout: 180

nebula:
  base_url: https://nebula.cs.vu.nl/api/chat/completions
  api_key_env: NEBULA_API_KEY
  models:
    text: SURF.gpt-oss-120b
    vision: SURF.Qwen2.5-VL-32B-Instruct-AWQ
  timeout: 180
