# Dialogue over ROS 2: the ROS endpoints of SMPA's existing interfaces and the Dialogue's stage adapters.
# Use it with:
#   ros2 launch smpa_gui gui.launch.py smpa_layout:=$(ros2 pkg prefix smpa_gui)/share/smpa_gui/layouts/dialogue-ros.yaml
# Every entry is optional. This file states the defaults; copy it and change what differs.
ros:
  endpoints:                                    # SMPA's nodes launched without a namespace use these names
    smpa_get_status: /smpa/get_status           # smpa_control, smpa_ros_interfaces/srv/GetSmpaStatus
    smpa_events: /smpa/events                   # smpa_control, smpa_ros_interfaces/msg/SmpaEvent
    llm_list_models: /llm/list_models           # llm_server, smpa_ros_interfaces/srv/ListModels
    llm_get_model_status: /llm/get_model_status # llm_server, smpa_ros_interfaces/srv/GetModelStatus
    llm_inference_status: /llm/inference_status # llm_server, smpa_ros_interfaces/msg/InferenceStatus
dialogue:
  context: independent      # independent: the Dialogue's own session holds its beliefs; shared: the robot's run
  stages:                   # the stage interfaces are being defined by Codex; until then every stage is pending
    sense: pending
    model: pending
    plan: pending
    act: pending
  # Once a stage interface exists, describe it instead of "pending", for example (shape only, not a contract):
  #   plan:
  #     kind: action                        # or: service
  #     endpoint: /dialogue/plan            # the stage node's action or service name
  #     type: smpa_ros_interfaces/action/X  # its installed interface type
  #     request: {belief_context_id: '{belief_context_id}', utterance: '{message}'}   # fields <- turn values
  #     outputs: {response: response_text}  # turn values <- result fields (dotted paths)
  #     success: success                    # optional boolean result field that must be true
  #     error: error_message                # optional text field explaining a failure
  #     timeout_s: 120
