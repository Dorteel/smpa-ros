# Used only when vision.backend or modeling.backend is api in pipeline.yaml.
# Keep credentials in the repository .env or process environment, never here.
openai:
  base_url: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY
  models:
    text: gpt-4.1-mini
    vision: gpt-4.1-mini
  timeout: 180

nebula:
  base_url: https://nebula.cs.vu.nl/api/chat/completions
  api_key_env: NEBULA_API_KEY
  models:
    text: SURF.gpt-oss-120b
    vision: SURF.Qwen2.5-VL-32B-Instruct-AWQ
  timeout: 180